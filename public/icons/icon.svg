<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#141226"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Neon Brand Gradient (Magenta -> Purple -> Blue) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rounded Square App Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="6" opacity="0.85"/>

  <!-- Subtle Ambient Glow in Center -->
  <circle cx="256" cy="256" r="160" fill="url(#brandGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Modern Stylized Reel/Play Ring -->
  <g filter="url(#glow)">
    <!-- Outer Gradient Pill / Ring Accent -->
    <rect x="106" y="106" width="300" height="300" rx="76" fill="none" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Accent Dots resembling modern reel sprocket / camera aperture -->
    <circle cx="356" cy="156" r="14" fill="#ec4899"/>
    <circle cx="156" cy="156" r="10" fill="#a855f7" opacity="0.8"/>
  </g>

  <!-- Video Play Silhouette merged with Download Arrow -->
  <!-- Stylized Play Symbol Base -->
  <path d="M196 172 C 196 162, 206 156, 215 161 L 285 201 C 294 206, 294 218, 285 223 L 215 263 C 206 268, 196 262, 196 252 Z" 
        fill="url(#brandGrad)" opacity="0.9" filter="url(#innerGlow)"/>

  <!-- Bold, Clean Download Arrow in Foreground -->
  <g filter="url(#innerGlow)">
    <!-- Arrow Stem -->
    <path d="M 256 195 L 256 312" stroke="url(#arrowGrad)" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Arrow Head -->
    <path d="M 204 276 L 256 328 L 308 276" fill="none" stroke="url(#arrowGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Lower Download Tray / Arc -->
    <path d="M 180 358 L 332 358" stroke="url(#brandGrad)" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- PRO Badge at Bottom Right -->
  <g transform="translate(304, 396)">
    <rect x="0" y="0" width="88" height="34" rx="10" fill="url(#brandGrad)"/>
    <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PRO</text>
  </g>
</svg>
